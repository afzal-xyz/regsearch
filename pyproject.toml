[project]
name = "regsearch"
version = "0.1.0"
description = "Hybrid RAG search over the US Code of Federal Regulations (eCFR)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.0",
    "sqlite-vec>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "truststore>=0.10.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: hits the network / is slow (deselect with -m 'not slow')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# pyflakes, pycodestyle errors/warnings, isort, pyupgrade, flake8-bugbear.
select = ["E", "F", "W", "I", "UP", "B"]
